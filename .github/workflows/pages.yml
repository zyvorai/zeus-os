name: Docs site
on:
  push:
    branches: [main]
    paths: ["docs/**", "site/**", "README.md"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: [self-hosted, zyvor-build]
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install "mkdocs-material==9.5.*"
          printf 'site_name: Zeus OS\ndocs_dir: docs\ntheme:\n  name: material\n' > mkdocs.yml
          "$RUNNER_TEMP/venv/bin/mkdocs" build -d _site/docs
          cp -R site/. _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: d
        uses: actions/deploy-pages@v4
